services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7
    ports:
      # Host Redis thường đã bind 6379; map ra 6380 để tránh xung đột
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Tạo database ecommerce nếu chưa có (không đụng database debase)
  ensure-db:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      ECOMMERCE_DB: ${ECOMMERCE_DB:-ecommerce}
    entrypoint:
      - /bin/sh
      - -c
      - |
        psql -h postgres -U "$$POSTGRES_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='$$ECOMMERCE_DB'" | grep -q 1 \
          || psql -h postgres -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE $$ECOMMERCE_DB OWNER $$POSTGRES_USER;"
    restart: "no"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ensure-db:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Host `postgres` là service name trong Docker network (không phải secret)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ECOMMERCE_DB:-ecommerce}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      PANCAKE_API_BASE_URL: ${PANCAKE_API_BASE_URL:-https://api.pancake.vn}
      PANCAKE_SHOP_ID: ${PANCAKE_SHOP_ID}
      PANCAKE_API_KEY: ${PANCAKE_API_KEY}
      PANCAKE_WAREHOUSE_ID: ${PANCAKE_WAREHOUSE_ID}
      FILE_UPLOAD_DIR: ${FILE_UPLOAD_DIR:-/var/www/html/images/thiyen}
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "5678:5678"
    volumes:
      - /var/www/html/images/thiyen:/var/www/html/images/thiyen
      - app_log:/app/log
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: dragun-cloud_postgres_data
  app_log:
