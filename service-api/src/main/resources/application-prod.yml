spring:
  # Database configuration cho môi trường PRODUCTION
  # LƯU Ý: Nên sử dụng biến môi trường cho production, không hardcode credentials
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: WARN
    com.dragun.ecommerce: INFO
    org.springframework.security: WARN

server:
  port: ${PORT:5678}


