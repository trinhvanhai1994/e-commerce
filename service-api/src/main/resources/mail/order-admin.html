<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'Đơn mới #' + ${mail.orderId}">Đơn mới</title>
</head>
<body style="margin:0;padding:16px;font-family:Arial,Helvetica,sans-serif;color:#2b2b2b;font-size:14px;line-height:1.6;">
<h2 style="margin:0 0 12px;font-size:18px;">Có đơn hàng mới <span th:text="'#' + ${mail.orderId}">#1</span></h2>
<table role="presentation" cellpadding="2" cellspacing="0" style="margin-bottom:16px;">
  <tr><td style="color:#777;width:130px;">Thời gian</td><td th:text="${mail.orderDate}">01/01/2026 10:00</td></tr>
  <tr><td style="color:#777;">Khách hàng</td><td th:text="${mail.customerName}">Khách</td></tr>
  <tr><td style="color:#777;">Số điện thoại</td><td th:text="${mail.customerPhone}">0900000000</td></tr>
  <tr th:if="${mail.customerEmail != null}"><td style="color:#777;">Email</td><td th:text="${mail.customerEmail}">a@b.c</td></tr>
  <tr><td style="color:#777;">Địa chỉ</td><td th:text="${mail.shippingAddress}">Địa chỉ</td></tr>
  <tr><td style="color:#777;">Thanh toán</td><td th:text="${mail.paymentMethod}">COD</td></tr>
</table>
<table cellpadding="6" cellspacing="0" style="border-collapse:collapse;border:1px solid #ddd;">
  <tr style="background:#f5f5f5;">
    <th align="left">Sản phẩm</th><th align="center">SL</th><th align="right">Đơn giá</th><th align="right">Thành tiền</th>
  </tr>
  <tr th:each="line : ${mail.lines}" style="border-top:1px solid #ddd;">
    <td th:text="${line.name}">Sản phẩm</td>
    <td align="center" th:text="${line.quantity}">1</td>
    <td align="right" th:text="${line.unitPrice}">0đ</td>
    <td align="right" th:text="${line.lineTotal}">0đ</td>
  </tr>
  <tr style="border-top:1px solid #ddd;"><td colspan="3" align="right">Tạm tính</td><td align="right" th:text="${mail.subTotal}">0đ</td></tr>
  <tr><td colspan="3" align="right">Phí vận chuyển</td><td align="right" th:text="${mail.shippingFee}">0đ</td></tr>
  <tr><td colspan="3" align="right"><strong>Tổng cộng</strong></td><td align="right"><strong th:text="${mail.total}">0đ</strong></td></tr>
</table>
<p th:if="${mail.adminOrdersUrl != null}" style="margin-top:16px;">
  <a th:href="${mail.adminOrdersUrl}">Mở trang quản lý đơn hàng</a>
</p>
</body>
</html>
