spring:
  application:
    name: ecommerce-api
  
  # Active profile sẽ được set khi build/run:
  # - Maven: mvn spring-boot:run -Dspring-boot.run.profiles=dev
  # - JAR: java -jar app.jar --spring.profiles.active=dev
  # - Environment: SPRING_PROFILES_ACTIVE=dev
  # - Default: dev (nếu không set)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Datasource config được định nghĩa riêng trong từng profile:
  # - application-dev.yml: database ecommerce_dev
  # - application-test.yml: database ecommerce_test
  # - application-prod.yml: database ecommerce_prod
  datasource:
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  # OAuth2 configuration will be added here when needed
  # Example:
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #           scope: openid,profile,email

server:
  port: 5678
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:ThiYenEcommerceSecretKey2024ForJWTTokenGeneration}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO
    com.dragun.ecommerce: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: OFF

# File upload configuration
# Thư mục lưu trữ ảnh trên Ubuntu host
# Đường dẫn tuyệt đối: /var/www/html/images/thiyen/
# Có thể override bằng biến môi trường FILE_UPLOAD_DIR
file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/www/html/images/thiyen}

pancake:
  api:
    # Base URL của Pancake API
    # Official Pancake POS Open API (see https://api-docs.pancake.biz/)
    base-url: ${PANCAKE_API_BASE_URL:https://pos.pages.fm/api/v1}
    # Shop ID: Lấy từ URL sau khi đăng nhập Pancake POS (đã có: 1021175491)
    shop-id: ${PANCAKE_SHOP_ID:1021175491}
    # API Key: Lấy từ Cấu hình > Nâng cao > Webhook-API trong Pancake POS
    # Xem hướng dẫn chi tiết trong file PANCAKE_SETUP.md
    api-key: ${PANCAKE_API_KEY:cfad4efd4c774a5397478c916662b830}
    # Warehouse ID: Lấy từ Cấu hình > Cửa hàng > Kho hàng trong Pancake POS
    # Xem hướng dẫn chi tiết trong file PANCAKE_SETUP.md
    warehouse-id: ${PANCAKE_WAREHOUSE_ID:22def263-b5cd-41e3-91bd-6f1e929353ed}
    timeout: ${PANCAKE_API_TIMEOUT:30000}
    retry:
      max-attempts: 3
      backoff-delay: 1000
  sync:
    enabled: ${PANCAKE_SYNC_ENABLED:true}
    direction: ${PANCAKE_SYNC_DIRECTION:BIDIRECTIONAL}
    skip-already-imported-orders: ${PANCAKE_SYNC_SKIP_IMPORTED_ORDERS:true}
    schedule:
      catalog:
        enabled: ${PANCAKE_SYNC_CATALOG_ENABLED:true}
        cron: ${PANCAKE_SYNC_CATALOG_CRON:0 0 */6 * * *}
      products:
        enabled: ${PANCAKE_SYNC_PRODUCTS_ENABLED:true}
        cron: ${PANCAKE_SYNC_PRODUCTS_CRON:0 */30 * * * *}
      orders:
        enabled: ${PANCAKE_SYNC_ORDERS_ENABLED:false}
        cron: ${PANCAKE_SYNC_ORDERS_CRON:0 */15 * * * *}

meinvoice:
  enabled: ${MEINVOICE_ENABLED:true}
  api:
    base-url: ${MEINVOICE_API_BASE_URL:https://api.meinvoice.vn/api/integration}
    timeout-ms: ${MEINVOICE_API_TIMEOUT_MS:60000}
  credentials:
    taxcode: ${MEINVOICE_TAXCODE:008300006641}
    username: ${MEINVOICE_USERNAME:thiyen.vietnam@gmail.com}
    password: ${MEINVOICE_PASSWORD:}
  defaults:
    invoice-with-code: ${MEINVOICE_INVOICE_WITH_CODE:true}
    invoice-template-id: ${MEINVOICE_TEMPLATE_ID:4ae1095d-409c-4dc1-bfee-776a526034ea}
    inv-series: ${MEINVOICE_INV_SERIES:2C26MYY}
    currency-code: ${MEINVOICE_CURRENCY_CODE:VND}
    default-vat-rate: ${MEINVOICE_DEFAULT_VAT_RATE:10}
    default-unit-name: ${MEINVOICE_DEFAULT_UNIT_NAME:Cái}
    assume-prices-exclude-vat: ${MEINVOICE_ASSUME_PRICES_EXCLUDE_VAT:true}


