spring:
  application:
    name: ecommerce-api
  
  profiles:
    active: dev
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:dragun}
    password: ${SPRING_DATASOURCE_PASSWORD:Picachu@123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  # OAuth2 configuration will be added here when needed
  # Example:
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #           scope: openid,profile,email

server:
  port: 5678
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:ThiYenEcommerceSecretKey2024ForJWTTokenGeneration}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO
    com.dragun.ecommerce: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: OFF


