spring:
  application:
    name: ecommerce-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  
  # Active profile sẽ được set khi build/run:
  # - Maven: mvn spring-boot:run -Dspring-boot.run.profiles=dev
  # - JAR: java -jar app.jar --spring.profiles.active=dev
  # - Environment: SPRING_PROFILES_ACTIVE=dev
  # - Default: dev (nếu không set)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Datasource config được định nghĩa riêng trong từng profile:
  # - application-dev.yml: database ecommerce_dev
  # - application-test.yml: database ecommerce_test
  # - application-prod.yml: database ecommerce_prod
  datasource:
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  # OAuth2 configuration will be added here when needed
  # Example:
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_CLIENT_ID}
  #           client-secret: ${GOOGLE_CLIENT_SECRET}
  #           scope: openid,profile,email

server:
  port: 5678
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO
    com.dragun.ecommerce: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: OFF

# File upload configuration
# Thư mục lưu trữ ảnh trên Ubuntu host
# Đường dẫn tuyệt đối: /var/www/html/images/thiyen/
# Có thể override bằng biến môi trường FILE_UPLOAD_DIR
file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/www/html/images/thiyen}

pancake:
  api:
    # Base URL của Pancake API
    base-url: ${PANCAKE_API_BASE_URL:https://api.pancake.vn}
    # Shop ID / API Key / Warehouse ID: đặt trong .env (không commit)
    shop-id: ${PANCAKE_SHOP_ID}
    api-key: ${PANCAKE_API_KEY}
    warehouse-id: ${PANCAKE_WAREHOUSE_ID}
    timeout: ${PANCAKE_API_TIMEOUT:30000}
    retry:
      max-attempts: 3
      backoff-delay: 1000
  sync:
    enabled: ${PANCAKE_SYNC_ENABLED:false}
    direction: ${PANCAKE_SYNC_DIRECTION:BIDIRECTIONAL}
    schedule:
      products:
        enabled: ${PANCAKE_SYNC_PRODUCTS_ENABLED:false}
        cron: ${PANCAKE_SYNC_PRODUCTS_CRON:0 */30 * * * *}
      orders:
        enabled: ${PANCAKE_SYNC_ORDERS_ENABLED:false}
        cron: ${PANCAKE_SYNC_ORDERS_CRON:0 */15 * * * *}

# Email thông báo đơn hàng (task-005), gửi qua Brevo REST API.
# Tắt mặc định: khi tắt, hoặc thiếu from-email / BREVO_API_KEY, mail chỉ được ghi log.
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Địa chỉ gửi, phải là sender hoặc domain đã xác minh trong Brevo
    from-email: ${MAIL_FROM_EMAIL:}
    from-name: ${MAIL_FROM_NAME:Thi Yên}
    # Danh sách email admin nhận báo đơn mới, cách nhau bằng dấu phẩy
    admin-recipients: ${MAIL_ADMIN_RECIPIENTS:}
    # URL storefront để gắn link trong mail (vd https://thiyen.vn); trống thì mail không có link
    store-url: ${MAIL_STORE_URL:}
    support-phone: ${MAIL_SUPPORT_PHONE:}
    brevo:
      # API key (tab "API keys" trong Brevo), KHÔNG phải SMTP key. Đặt trong .env, không commit
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_API_BASE_URL:https://api.brevo.com}
      connect-timeout: 10s
      read-timeout: 30s
